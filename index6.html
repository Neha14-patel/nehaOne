<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <!-- <button onclick="fun()">Hide</button> -->


    <div id="jsr">
        Jamshedpur, also known as Tatanagar, is the largest industrial city in Jharkhand, India, famous as the "Steel
        City of India".
    </div>

    <script>
        function fun() {
            if (document.getElementById("jsr").style.display === "none") {
                document.getElementById("jsr").style.display = "block";
                document.getElementById("btn").innerHTML = "Hide";

            }
            else {
                document.getElementById("jsr").style.display = "none";
                document.getElementById("btn").innerHTML = "Show";
            }
        }

    </script>
    <button onclick="fun()" id="btn">hide</button>

</body>

</html>
